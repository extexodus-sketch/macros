<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>maCros</title>
  <meta name="description" content="Type or say what you're eating and get exact calories, protein, carbs, fat and fiber — with Filipino foods built in.">
  <meta name="theme-color" content="#F6FAF8">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="maCros">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="gate" id="gate" hidden></div>
  <div class="setup" id="setup" hidden></div>
  <div class="app" id="app" hidden>
    <header class="topbar">
      <span aria-hidden="true"></span>
      <a class="brand" href="#day" aria-label="maCros home">
        <img src="icon.svg" alt="" width="40" height="40">
        <span>maCros</span>
      </a>
      <button class="today-pill" type="button" id="todayPill" title="Tap to switch between eaten and left">Day 1 · 0 kcal</button>
    </header>

    <main>
      <!-- DASHBOARD: swipe between Today and This week -->
      <section id="view-day" class="view">
        <div class="seg two dash-seg" id="dashSeg" role="tablist" aria-label="Dashboard pages">
          <button type="button" role="tab" class="on" aria-selected="true" data-page="day">Today</button>
          <button type="button" role="tab" aria-selected="false" data-page="week">This week</button>
        </div>
        <div id="pageDay" class="dash-page">
          <div class="day-nav">
            <button class="icon-btn" id="dayPrev" type="button" aria-label="Previous day">&#8249;</button>
            <div class="day-title"><h1 id="dayTitle">Today</h1><small id="daySub"></small></div>
            <button class="icon-btn" id="dayNext" type="button" aria-label="Next day">&#8250;</button>
          </div>
          <div id="dayBody"></div>
        </div>
        <div id="pageWeek" class="dash-page" hidden></div>
      </section>

      <!-- ADD: type or say it on top, browse foods below -->
      <section id="view-add" class="view" hidden aria-labelledby="askLabel">
        <div class="ask">
          <label for="q" id="askLabel" class="ask-label">What are you eating?</label>
          <div class="ask-box" id="askBox">
            <textarea id="q" rows="2" autocomplete="off" autocapitalize="off" spellcheck="false"
              placeholder="e.g. 100g chicken breast, 1 cup rice, 300 kcal nuggets"></textarea>
            <button id="clearQ" class="clear-q" type="button" aria-label="Clear" hidden>&times;</button>
            <button id="mic" class="mic" type="button" aria-label="Speak what you ate">
              <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M12 15a3.5 3.5 0 0 0 3.5-3.5v-6a3.5 3.5 0 1 0-7 0v6A3.5 3.5 0 0 0 12 15Zm6-3.5a1 1 0 1 0-2 0 4 4 0 0 1-8 0 1 1 0 1 0-2 0 6 6 0 0 0 5 5.91V20H9a1 1 0 1 0 0 2h6a1 1 0 1 0 0-2h-2v-2.59a6 6 0 0 0 5-5.91Z"/></svg>
            </button>
          </div>
          <p class="voice-status" id="voiceStatus" aria-live="polite"></p>
        </div>
        <div class="water" id="water"></div>
        <div id="results" aria-live="polite"></div>
        <div id="browse">
          <div class="foods-head">
            <h2>Browse foods</h2>
            <button class="btn small ghost" id="addCustomBtn" type="button">+ My own food</button>
          </div>
          <div class="cats" id="cats" role="tablist" aria-label="Sources"></div>
          <p class="muted small" id="foodCount"></p>
          <div id="foodList" class="food-list"></div>
          <div id="foodsFoot"></div>
        </div>
      </section>

      <!-- MENU -->
      <section id="view-menu" class="view" hidden>
        <h1>Menu</h1>
        <div id="menuBody"></div>
      </section>
      <section id="view-goals" class="view" hidden>
        <div class="sub-head"><a class="icon-btn" href="#menu" aria-label="Back to menu">&#8249;</a><h1>Goals</h1></div>
        <div id="goalsBody"></div>
      </section>
      <section id="view-progress" class="view" hidden>
        <div class="sub-head"><a class="icon-btn" href="#menu" aria-label="Back to menu">&#8249;</a><h1>Progress</h1></div>
        <div id="progressBody"></div>
      </section>
      <section id="view-tutorial" class="view" hidden>
        <div class="sub-head"><a class="icon-btn" href="#menu" aria-label="Back to menu">&#8249;</a><h1>Tutorial</h1></div>
        <div id="tutorialBody"></div>
      </section>
      <section id="view-settings" class="view" hidden>
        <div class="sub-head"><a class="icon-btn" href="#menu" aria-label="Back to menu">&#8249;</a><h1>Settings</h1></div>
        <div id="settingsBody"></div>
      </section>
    </main>

    <nav class="tabbar" aria-label="Main">
      <a href="#day" data-tab="day"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M7 2a1 1 0 0 1 1 1v1h8V3a1 1 0 1 1 2 0v1h1a3 3 0 0 1 3 3v12a3 3 0 0 1-3 3H5a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3h1V3a1 1 0 0 1 1-1Zm13 8H4v9a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-9Z"/></svg><span>Dashboard</span></a>
      <a href="#add" data-tab="add"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 1 1 0 20 10 10 0 0 1 0-20Zm0 5a1 1 0 0 0-1 1v3H8a1 1 0 1 0 0 2h3v3a1 1 0 1 0 2 0v-3h3a1 1 0 1 0 0-2h-3V8a1 1 0 0 0-1-1Z"/></svg><span>Add</span></a>
      <a href="#menu" data-tab="menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 6a1 1 0 0 1 1-1h14a1 1 0 1 1 0 2H5a1 1 0 0 1-1-1Zm0 6a1 1 0 0 1 1-1h14a1 1 0 1 1 0 2H5a1 1 0 0 1-1-1Zm1 5a1 1 0 1 0 0 2h14a1 1 0 1 0 0-2H5Z"/></svg><span>Menu</span></a>
    </nav>
  </div>

  <div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="foods.js"></script>
  <script src="suggestions.js"></script>
  <script src="engine.js"></script>
  <script src="firebase-config.js"></script>
  <script src="setup.js"></script>
  <script src="app.js"></script>
  <script type="module" src="boot.js"></script>
</body>
</html>
