<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>maCros</title>
  <meta name="description" content="Type or say what you're eating and get exact calories, protein, carbs, fat and fiber — with Filipino foods built in.">
  <meta name="theme-color" content="#F6FAF8">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="maCros">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="gate" id="gate" hidden></div>
  <div class="setup" id="setup" hidden></div>
  <div class="app" id="app" hidden>
    <header class="topbar">
      <button class="bell" type="button" id="bellBtn" aria-label="What’s new">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M12 22a2.5 2.5 0 0 0 2.45-2h-4.9A2.5 2.5 0 0 0 12 22Zm7-6V11a7 7 0 0 0-5.5-6.84V3.5a1.5 1.5 0 0 0-3 0v.66A7 7 0 0 0 5 11v5l-1.7 1.7A1 1 0 0 0 4 19.4h16a1 1 0 0 0 .7-1.7L19 16Z"/></svg>
        <span class="bell-badge" id="bellBadge" hidden></span>
      </button>
      <a class="brand" href="#day" aria-label="maCros home">
        <img src="icon.svg" alt="" width="40" height="40">
        <span>maCros</span>
      </a>
      <button class="today-pill" type="button" id="todayPill" title="Tap to switch between eaten and left">Day 1 · 0 kcal</button>
    </header>

    <main>
      <!-- DASHBOARD: swipe between Today and This week -->
      <section id="view-day" class="view">
        <div class="seg two dash-seg" id="dashSeg" role="tablist" aria-label="Dashboard pages">
          <button type="button" role="tab" class="on" aria-selected="true" data-page="day">Today</button>
          <button type="button" role="tab" aria-selected="false" data-page="week">This week</button>
        </div>
        <div id="pageDay" class="dash-page">
          <div class="day-nav">
            <button class="icon-btn" id="dayPrev" type="button" aria-label="Previous day">&#8249;</button>
            <div class="day-title"><h1 id="dayTitle">Today</h1><small id="daySub"></small></div>
            <button class="icon-btn" id="dayNext" type="button" aria-label="Next day">&#8250;</button>
          </div>
          <div id="dayBody"></div>
        </div>
        <div id="pageWeek" class="dash-page" hidden></div>
      </section>

      <!-- ADD: water, then type a food, then browse foods -->
      <section id="view-add" class="view" hidden aria-labelledby="askLabel">
        <div class="water" id="water"></div>
        <div class="ask">
          <label for="q" id="askLabel" class="sr-only">What are you eating?</label>
          <div class="ask-box slim" id="askBox">
            <textarea id="q" rows="1" autocomplete="off" autocapitalize="off" spellcheck="false"
              placeholder="Type a food, e.g. 2 eggs, 1 cup rice"></textarea>
            <button id="clearQ" class="clear-q" type="button" aria-label="Clear" hidden>&times;</button>
          </div>
        </div>
        <div id="results" aria-live="polite"></div>
        <div id="browse">
          <div class="foods-head">
            <h2>Browse foods</h2>
            <button class="btn small ghost" id="addCustomBtn" type="button">+ My own food</button>
          </div>
          <div class="cats" id="cats" role="tablist" aria-label="Sources"></div>
          <p class="muted small" id="foodCount"></p>
          <div id="foodList" class="food-list"></div>
          <div id="foodsFoot"></div>
        </div>
      </section>

      <!-- MENU -->
      <section id="view-menu" class="view" hidden>
        <h1>Menu</h1>
        <div id="menuBody"></div>
      </section>
      <section id="view-goals" class="view" hidden>
        <h1>Goals</h1>
        <div id="goalsBody"></div>
      </section>
      <section id="view-progress" class="view" hidden>
        <h1>Progress</h1>
        <div id="progressBody"></div>
      </section>
      <section id="view-tutorial" class="view" hidden>
        <div class="sub-head"><a class="icon-btn" href="#menu" aria-label="Back to menu">&#8249;</a><h1>Tutorial</h1></div>
        <div id="tutorialBody"></div>
      </section>
      <section id="view-settings" class="view" hidden>
        <div class="sub-head"><a class="icon-btn" href="#menu" aria-label="Back to menu">&#8249;</a><h1>Settings</h1></div>
        <div id="settingsBody"></div>
      </section>
    </main>

    <nav class="tabbar" aria-label="Main">
      <a href="#day" data-tab="day"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M7 2a1 1 0 0 1 1 1v1h8V3a1 1 0 1 1 2 0v1h1a3 3 0 0 1 3 3v12a3 3 0 0 1-3 3H5a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3h1V3a1 1 0 0 1 1-1Zm13 8H4v9a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-9Z"/></svg><span>Dashboard</span></a>
      <a href="#progress" data-tab="progress"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 3a1 1 0 0 1 1 1v15h15a1 1 0 1 1 0 2H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Zm15.7 4.3a1 1 0 0 1 0 1.4l-5 5a1 1 0 0 1-1.4 0L11 11.4l-3.3 3.3a1 1 0 0 1-1.4-1.4l4-4a1 1 0 0 1 1.4 0l2.3 2.3 4.3-4.3a1 1 0 0 1 1.4 0Z"/></svg><span>Progress</span></a>
      <a href="#add" data-tab="add"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 1 1 0 20 10 10 0 0 1 0-20Zm0 5a1 1 0 0 0-1 1v3H8a1 1 0 1 0 0 2h3v3a1 1 0 1 0 2 0v-3h3a1 1 0 1 0 0-2h-3V8a1 1 0 0 0-1-1Z"/></svg><span>Add</span></a>
      <a href="#goals" data-tab="goals"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 1 1 0 20 10 10 0 0 1 0-20Zm0 2a8 8 0 1 0 0 16 8 8 0 0 0 0-16Zm0 3a5 5 0 1 1 0 10 5 5 0 0 1 0-10Zm0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6Zm0 2a1 1 0 1 1 0 2 1 1 0 0 1 0-2Z"/></svg><span>Goals</span></a>
      <a href="#menu" data-tab="menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 6a1 1 0 0 1 1-1h14a1 1 0 1 1 0 2H5a1 1 0 0 1-1-1Zm0 6a1 1 0 0 1 1-1h14a1 1 0 1 1 0 2H5a1 1 0 0 1-1-1Zm1 5a1 1 0 1 0 0 2h14a1 1 0 1 0 0-2H5Z"/></svg><span>Menu</span></a>
    </nav>
    <!-- One button above the Add tab: HOLD, then slide left (Quick add), up (Scan) or right (Voice) and let go. A tap shows all three. -->
    <div class="hold-backdrop" id="holdBackdrop" hidden></div>
    <div class="hold-menu" id="holdMenu">
      <svg class="hold-ring" viewBox="0 0 200 200" aria-hidden="true">
        <path class="ring-seg" data-dir="left" d="M64.8 129.6 A46 46 0 0 1 64.8 70.4"/>
        <path class="ring-seg" data-dir="up" d="M70.4 64.8 A46 46 0 0 1 129.6 64.8"/>
        <path class="ring-seg" data-dir="right" d="M135.2 70.4 A46 46 0 0 1 135.2 129.6"/>
      </svg>
      <button class="hold-opt" id="quickBtn" data-dir="left" type="button" tabindex="-1" aria-label="Quick add"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M13 2 4 14h7l-1 8 9-12h-7l1-8Z"/></svg><span>Quick add</span></button>
      <button class="hold-opt" id="scanAnyBtn" data-dir="up" type="button" tabindex="-1" aria-label="Scan a barcode or a Nutrition Facts label"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M4 4h4v2H6v2H4V4Zm12 0h4v4h-2V6h-2V4ZM4 16h2v2h2v2H4v-4Zm14 2v-2h2v4h-4v-2h2ZM7 8h1.5v8H7V8Zm3 0h1v8h-1V8Zm2.5 0H14v8h-1.5V8Zm3 0h1v8h-1V8Z"/></svg><span>Scan</span></button>
      <button class="hold-opt" id="voiceBtn" data-dir="right" type="button" tabindex="-1" aria-label="Voice: say what you ate, a glass of water or your weight"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M12 15a3.5 3.5 0 0 0 3.5-3.5v-6a3.5 3.5 0 1 0-7 0v6A3.5 3.5 0 0 0 12 15Zm6-3.5a1 1 0 1 0-2 0 4 4 0 0 1-8 0 1 1 0 1 0-2 0 6 6 0 0 0 5 5.91V20H9a1 1 0 1 0 0 2h6a1 1 0 1 0 0-2h-2v-2.59a6 6 0 0 0 5-5.91Z"/></svg><span>Voice</span></button>
      <button class="hold-btn" id="fabHold" type="button" aria-label="Hold and slide: left for Quick add, up for Scan, right for Voice. Or tap to see all three." aria-expanded="false"><svg class="hb-hold" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M9.5 2A2.5 2.5 0 0 0 7 4.5v8.1l-.9-.9a2.3 2.3 0 0 0-3.2 3.2l4.6 4.9A6 6 0 0 0 11.9 22H14a6 6 0 0 0 6-6v-4.5a2.5 2.5 0 0 0-3.6-2.2 2.5 2.5 0 0 0-3.3-1.2A2.5 2.5 0 0 0 12 7.6V4.5A2.5 2.5 0 0 0 9.5 2Zm0 2a.5.5 0 0 1 .5.5V12a1 1 0 1 0 2 0V9.5a.5.5 0 0 1 1 0V12a1 1 0 1 0 2 0v-1.5a.5.5 0 0 1 1 0V12a1 1 0 1 0 2 0v-.5a.5.5 0 0 1 1 0V16a4 4 0 0 1-4 4h-2.1a4 4 0 0 1-2.9-1.3l-4.6-4.9a.3.3 0 0 1 .4-.4l2.6 2.6A1 1 0 0 0 9 15.3V4.5a.5.5 0 0 1 .5-.5Z"/></svg><span class="hb-word">HOLD</span><svg class="hb-mic" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M12 15a3.5 3.5 0 0 0 3.5-3.5v-6a3.5 3.5 0 1 0-7 0v6A3.5 3.5 0 0 0 12 15Zm6-3.5a1 1 0 1 0-2 0 4 4 0 0 1-8 0 1 1 0 1 0-2 0 6 6 0 0 0 5 5.91V20H9a1 1 0 1 0 0 2h6a1 1 0 1 0 0-2h-2v-2.59a6 6 0 0 0 5-5.91Z"/></svg></button>
    </div>
    <!-- Voice: floats above the circles and shows what you say as you say it -->
    <div class="voice-float" id="voiceFloat" hidden aria-live="polite">
      <div class="vf-top"><span class="vf-dot" aria-hidden="true"></span><b id="vfState">Listening…</b>
        <button class="icon-btn" type="button" id="vfCancel" aria-label="Cancel">&times;</button></div>
      <p class="vf-text" id="vfText"></p>
      <div class="vf-foot"><span class="muted small" id="vfHint">Let go when you’re done.</span><button class="btn small" type="button" id="vfDone" hidden>Done</button></div>
    </div>
  </div>

  <div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="foods.js"></script>
  <script src="suggestions.js"></script>
  <script src="engine.js"></script>
  <script src="firebase-config.js"></script>
  <script src="updates.js"></script>
  <script src="install.js"></script>
  <script src="setup.js"></script>
  <script src="app.js"></script>
  <script type="module" src="boot.js"></script>
</body>
</html>
