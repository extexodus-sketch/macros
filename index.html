<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>maCros</title>
  <meta name="description" content="Type or say what you're eating and get exact calories, protein, carbs, fat and fiber — with Filipino foods built in.">
  <meta name="theme-color" content="#0F766E">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="maCros">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <a class="brand" href="#identify" aria-label="maCros home">
        <img src="icon.svg" alt="" width="34" height="34">
        <span><strong>maCros</strong></span>
      </a>
      <a class="today-pill" href="#day" id="todayPill">Day 1 · 0 kcal</a>
    </header>

    <main>
      <!-- IDENTIFY -->
      <section id="view-identify" class="view" aria-labelledby="askLabel">
        <div class="ask">
          <label for="q" id="askLabel" class="ask-label">What are you eating?</label>
          <div class="ask-box" id="askBox">
            <textarea id="q" rows="2" autocomplete="off" autocapitalize="off" spellcheck="false"
              placeholder="e.g. 100g chicken breast, 1 cup rice, 2 eggs"></textarea>
            <button id="clearQ" class="clear-q" type="button" aria-label="Clear" hidden>&times;</button>
            <button id="mic" class="mic" type="button" aria-label="Speak what you ate">
              <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M12 15a3.5 3.5 0 0 0 3.5-3.5v-6a3.5 3.5 0 1 0-7 0v6A3.5 3.5 0 0 0 12 15Zm6-3.5a1 1 0 1 0-2 0 4 4 0 0 1-8 0 1 1 0 1 0-2 0 6 6 0 0 0 5 5.91V20H9a1 1 0 1 0 0 2h6a1 1 0 1 0 0-2h-2v-2.59a6 6 0 0 0 5-5.91Z"/></svg>
            </button>
          </div>
          <p class="voice-status" id="voiceStatus" aria-live="polite"></p>
        </div>
        <div id="results" aria-live="polite"></div>
      </section>

      <!-- TODAY -->
      <section id="view-day" class="view" hidden>
        <div class="day-nav">
          <button class="icon-btn" id="dayPrev" type="button" aria-label="Previous day">&#8249;</button>
          <div class="day-title"><h1 id="dayTitle">Today</h1><small id="daySub"></small></div>
          <button class="icon-btn" id="dayNext" type="button" aria-label="Next day">&#8250;</button>
        </div>
        <div id="dayBody"></div>
      </section>

      <!-- FOODS -->
      <section id="view-foods" class="view" hidden>
        <div class="foods-head">
          <h1>Food database</h1>
          <button class="btn small" id="addCustomBtn" type="button">+ My own food</button>
        </div>
        <div class="seg" id="foodModes" role="tablist" aria-label="Food lists"></div>
        <p class="muted small mode-note" id="modeNote"></p>
        <div class="search-box">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M10.5 3a7.5 7.5 0 0 1 5.92 12.1l4.24 4.24a1 1 0 0 1-1.42 1.42l-4.24-4.24A7.5 7.5 0 1 1 10.5 3Zm0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11Z"/></svg>
          <input id="foodSearch" type="search" placeholder="Search foods (adobo, kanin, whey…)" autocomplete="off">
        </div>
        <div class="cats" id="cats" role="tablist" aria-label="Categories"></div>
        <p class="muted small" id="foodCount"></p>
        <div id="foodList" class="food-list"></div>
      </section>

      <!-- SETTINGS -->
      <section id="view-settings" class="view" hidden>
        <h1>Settings</h1>
        <div id="settingsBody"></div>
      </section>
    </main>

    <nav class="tabbar" aria-label="Main">
      <a href="#identify" data-tab="identify"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M10.5 3a7.5 7.5 0 0 1 5.92 12.1l4.24 4.24a1 1 0 0 1-1.42 1.42l-4.24-4.24A7.5 7.5 0 1 1 10.5 3Zm0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11Z"/></svg><span>Identify</span></a>
      <a href="#day" data-tab="day"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M7 2a1 1 0 0 1 1 1v1h8V3a1 1 0 1 1 2 0v1h1a3 3 0 0 1 3 3v12a3 3 0 0 1-3 3H5a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3h1V3a1 1 0 0 1 1-1Zm13 8H4v9a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-9Z"/></svg><span>My Day</span></a>
      <a href="#foods" data-tab="foods"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 5a2 2 0 0 1 2-2h9l5 5v11a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5Zm4 6a1 1 0 1 0 0 2h8a1 1 0 1 0 0-2H8Zm0 4a1 1 0 1 0 0 2h5a1 1 0 1 0 0-2H8Z"/></svg><span>Foods</span></a>
      <a href="#settings" data-tab="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M13.4 2.2a1 1 0 0 1 1 .8l.3 1.9c.5.2 1 .5 1.4.8l1.8-.7a1 1 0 0 1 1.2.4l1.4 2.4a1 1 0 0 1-.2 1.3l-1.5 1.2a6.8 6.8 0 0 1 0 1.6l1.5 1.2a1 1 0 0 1 .2 1.3l-1.4 2.4a1 1 0 0 1-1.2.4l-1.8-.7c-.4.3-.9.6-1.4.8l-.3 1.9a1 1 0 0 1-1 .8h-2.8a1 1 0 0 1-1-.8l-.3-1.9c-.5-.2-1-.5-1.4-.8l-1.8.7a1 1 0 0 1-1.2-.4l-1.4-2.4a1 1 0 0 1 .2-1.3l1.5-1.2a6.8 6.8 0 0 1 0-1.6L3.7 8.9a1 1 0 0 1-.2-1.3l1.4-2.4a1 1 0 0 1 1.2-.4l1.8.7c.4-.3.9-.6 1.4-.8l.3-1.9a1 1 0 0 1 1-.8h2.8ZM12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6Z"/></svg><span>Settings</span></a>
    </nav>
  </div>

  <div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="foods.js"></script>
  <script src="suggestions.js"></script>
  <script src="engine.js"></script>
  <script src="app.js"></script>
</body>
</html>
